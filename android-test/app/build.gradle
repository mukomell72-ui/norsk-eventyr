plugins {
    id 'com.android.application'
}
def testUrl = providers.gradleProperty('norskUrl').orElse('').get()
if (!(testUrl ==~ /^https:\/\/[A-Za-z0-9-]+\.vercel\.app\/$/) || !testUrl.contains('git-feature-nora-personal')) {
    throw new GradleException('A verified HTTPS feature-preview URL is required via -PnorskUrl. Production is forbidden for this debug APK.')
}
android {
    namespace 'no.norskeventyr.personaltest'
    compileSdk 36
    defaultConfig {
        applicationId 'no.norskeventyr.personaltest'
        minSdk 26
        targetSdk 36
        versionCode 81
        versionName '8.1-private-test'
        buildConfigField 'String', 'START_URL', '"' + testUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
