name: Build DistanceHelp APK
on:
  push:
    branches: [distancehelp-android-build-20261011]
    paths:
      - 'distancehelp/**'
      - '.github/workflows/distancehelp-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        working-directory: distancehelp
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Save APK
        run: cp distancehelp/app/build/outputs/apk/debug/app-debug.apk DistanceHelp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DistanceHelp-install-apk
          path: DistanceHelp.apk
      - name: Publish APK only to isolated build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f DistanceHelp.apk
          git commit -m 'Build Android APK [skip ci]'
          git push
