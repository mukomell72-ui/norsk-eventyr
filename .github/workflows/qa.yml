name: Norsk Eventyr QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, preview/scene-course-a1, feature/living-story-renewal-20261026, feature/animated-living-world-20261026]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        # GitHub-hosted Ubuntu already includes the required shared libraries.
        # Avoid a full apt dependency reinstall on every PR, which can stall CI.
        run: npx playwright install chromium
      - name: Run QA suite
        working-directory: tests
        run: npm test
      - name: Locally fast-forward main and package merged source
        if: success() && github.ref == 'refs/heads/feature/living-story-renewal-20261026'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-merge-out
          base="$(git rev-parse refs/remotes/origin/main)"
          head="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$base" "$head"
          git diff --check "$base" "$head"
          git worktree add -b local-merge-delivery "$RUNNER_TEMP/norsk-eventyr-local-merged" "$base"
          git -C "$RUNNER_TEMP/norsk-eventyr-local-merged" merge --ff-only "$head"
          test "$(git -C "$RUNNER_TEMP/norsk-eventyr-local-merged" rev-parse HEAD)" = "$head"
          git -C "$RUNNER_TEMP/norsk-eventyr-local-merged" archive --format=zip --output="$GITHUB_WORKSPACE/local-merge-out/norsk-eventyr-local-merged-source.zip" HEAD
          git -C "$RUNNER_TEMP/norsk-eventyr-local-merged" bundle create "$GITHUB_WORKSPACE/local-merge-out/norsk-eventyr-local-merged.git.bundle" local-merge-delivery
          git -C "$RUNNER_TEMP/norsk-eventyr-local-merged" bundle verify "$GITHUB_WORKSPACE/local-merge-out/norsk-eventyr-local-merged.git.bundle"
          git clone --branch local-merge-delivery "$GITHUB_WORKSPACE/local-merge-out/norsk-eventyr-local-merged.git.bundle" "$RUNNER_TEMP/norsk-eventyr-verify"
          test "$(git -C "$RUNNER_TEMP/norsk-eventyr-verify" rev-parse HEAD)" = "$head"
          printf 'MAIN_BASE=%s\nLOCAL_MERGED=%s\nMERGE_MODE=fast-forward\nQA=passed before packaging\nPRODUCTION_PUBLISHED=no\n' "$base" "$head" > local-merge-out/LOCAL_MERGE_MANIFEST.txt
          (cd local-merge-out && sha256sum norsk-eventyr-local-merged-source.zip norsk-eventyr-local-merged.git.bundle > SHA256SUMS.txt)
      - name: Upload verified local merged source and portable Git bundle
        if: success() && github.ref == 'refs/heads/feature/living-story-renewal-20261026'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-local-merged-ready
          path: local-merge-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Bundle the exact 8.3.0 staging source after successful QA
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-local-staging-20261013'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload locally reproducible 8.3.0 staging archive
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-local-staging-20261013'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-staging-source
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Bundle the integrated 8.3.0 source for local testing
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'integration/norsk-eventyr-8-3-course-retention-20261014'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload integrated local source with checksum
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'integration/norsk-eventyr-8-3-course-retention-20261014'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-course-retention-local
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Bundle lesson6 release candidate after successful QA
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feature/verified-course-progression-20261014'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload pinned lesson6 release candidate
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feature/verified-course-progression-20261014'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-lesson6-release-candidate
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Build lesson12 release-candidate source after green QA
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feature/applied-forms-cloze-20261016'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload lesson12 pinned source, manifest and SHA256
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feature/applied-forms-cloze-20261016'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-lesson12-release-candidate
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Build lesson24 release-candidate after green QA
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-lesson24-learning-20261019'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload pinned lesson24 archive and SHA-256
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-lesson24-learning-20261019'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-lesson24-release-candidate
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Build audited learning update after successful QA
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-lesson24-audit-fixes-20261019'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload audited source ZIP, manifest and SHA-256
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-lesson24-audit-fixes-20261019'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-audit-fixes-release-candidate
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Package exact tested animated-world branch for local Vercel preview
        if: success() && ((github.event_name == 'pull_request' && github.head_ref == 'feature/animated-living-world-20261026') || github.ref == 'refs/heads/feature/animated-living-world-20261026')
        shell: bash
        env:
          NE_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate-out
          git cat-file -e "${NE_SOURCE_REF}^{commit}"
          git diff --check "origin/main...${NE_SOURCE_REF}"
          git archive --format=zip --output=candidate-out/norsk-eventyr-animated-world-source.zip "${NE_SOURCE_REF}"
          printf 'SOURCE_COMMIT=%s\nBASE=%s\nAUTOMATED_QA=passed\nRELEASE_TARGET=Vercel Preview (not production)\nPRODUCTION_PUBLISHED=no\n' "${NE_SOURCE_REF}" "$(git rev-parse origin/main)" > candidate-out/BUILD_MANIFEST.txt
          (cd candidate-out && sha256sum norsk-eventyr-animated-world-source.zip > SHA256SUMS.txt)
      - name: Upload QA-verified animated-world source for local testing
        if: success() && ((github.event_name == 'pull_request' && github.head_ref == 'feature/animated-living-world-20261026') || github.ref == 'refs/heads/feature/animated-living-world-20261026')
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-animated-world-verified
          path: candidate-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Store screenshots for manual visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.2-visual-QA
          path: tests/artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
