name: Norsk Eventyr QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run QA suite
        working-directory: tests
        run: npm test
      - name: Bundle the exact 8.3.0 staging source after successful QA
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-local-staging-20261013'
        env:
          NE_RELEASE_REF: ${{ github.event.pull_request.head.sha }}
        run: node tools/prepare-staging-release.cjs --ref "$NE_RELEASE_REF"
      - name: Upload locally reproducible 8.3.0 staging archive
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'release/8.3.0-local-staging-20261013'
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3.0-staging-source
          path: release-out/*
          retention-days: 14
          if-no-files-found: error
      - name: Store screenshots for manual visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.2-visual-QA
          path: tests/artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
