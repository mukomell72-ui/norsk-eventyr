name: Norsk Eventyr 8.3 private APK (no Play publication)

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-test/**'
      - '.github/workflows/android-private-apk.yml'

permissions:
  contents: read

jobs:
  personal-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_PREVIEW_SHA: 6b0165fa659fb347363b74ac707abffb5a69a4b1
      TEST_PREVIEW_URL: https://norsk-eventyr-no7xsypvy-fffff19.vercel.app/
    steps:
      - name: Checkout release branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned 8.3 Preview matches unchanged web app files
        run: |
          set -euo pipefail
          # This Android-only build deliberately embeds an immutable READY Preview.
          # Any changed web files require a NEW Preview and an updated pin.
          git diff --exit-code "$WEB_PREVIEW_SHA" HEAD -- '*.js' '*.mjs' '*.cjs' '*.html' '*.css' '*.json' '*.sql' '*.svg' '*.png' ':!android-test/**' ':!tests/**' ':!.github/**'
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 36 platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build local debug APK (release candidate preview only)
        run: gradle --no-daemon -p android-test assembleDebug "-PnorskUrl=$TEST_PREVIEW_URL"
      - name: Verify compiled artifact
        run: test -s android-test/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK embeds verified immutable 8.3 Preview URL
        run: |
          set -euo pipefail
          APK=android-test/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" 'classes*.dex' | strings | grep -F "$TEST_PREVIEW_URL"
          if unzip -p "$APK" 'classes*.dex' | strings | grep -F 'feature-820-placement-calibration'; then
            echo "ERROR: test APK still points to the old 8.2 feature preview" >&2
            exit 1
          fi
      - name: Save APK for private device testing
        uses: actions/upload-artifact@v4
        with:
          name: Norsk-Eventyr-8.3-private-debug-APK
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
